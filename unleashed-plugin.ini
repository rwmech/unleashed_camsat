; unleashed_camsat: the camera satellite.
;
; A cheap AI-Thinker ESP32-CAM (no SD card needed) running firmware/ takes
; the pictures and sends them over the µnleashed link (ESP-NOW) to a board,
; which files them in its Photos area like a snap from a built-in camera.
; bbs/ is the board's half, built into the firmware from this repository.
;
; Copyright 2026 - Robert Mech
; SPDX-License-Identifier: GPL-3.0-or-later
name        = camsat
version     = 1.0.0
api         = 1.0
descriptor  = kCamsatPlugin
requires    = link sd
boards      = *
license     = GPL-3.0-or-later
