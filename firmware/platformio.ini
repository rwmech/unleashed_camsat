[platformio]
default_envs = camsat

[env:camsat]
platform                = espressif32@6.9.0   ; ESP-IDF 5.3.1, the core's version
board                   = esp32dev
framework               = espidf
board_upload.flash_size = 4MB
board_build.partitions  = partitions.csv
upload_speed            = 921600
monitor_speed           = 115200
monitor_filters         = esp32_exception_decoder
extra_scripts           = pre:tools/fetch_core.py

; The bench: one picture at boot with no board, to prove the camera.
[env:camsat_selftest]
extends     = env:camsat
build_flags = -DCAMSAT_SELFTEST
