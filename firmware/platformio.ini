;
; File:         firmware/platformio.ini
; Module:       Build / PlatformIO project
;
; Purpose:      The satellite: an AI-Thinker ESP32-CAM (ESP32, 4 MB flash,
;               PSRAM, OV2640), no SD card. It pairs with a µnleashed board
;               over the link (ESP-NOW), takes a picture when the board asks,
;               and sends it.
;
;               Build:   pio run
;               Flash:   pio run -t upload --upload-port COMn
;               Console: pio device monitor --port COMn
;
;               tools/fetch_core.py runs first and copies the link and the
;               picture code out of the µnleashed core at the commit
;               ../core.lock pins.
